# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.next/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        시크릿과 개인정보가 소스, 설정, 테스트 데이터, 로그 또는 빌드 산출물에 노출되는 변경을 지적하세요.
        권한이 필요한 변경은 접근 권한을 검증하는지 확인하세요.
        변경한 동작의 정상·실패 경로를 테스트하는지, 자동 테스트가 실제 외부 API나 운영 자격 증명에 의존하는지 확인하세요.
        API·이벤트·DB·배포 설정 변경은 팀 협업 규칙에 따라 관련 명세가 갱신됐는지 확인하고, 영향받는 담당자에게 공유가 필요한 부분을 알려주세요.
chat:
  auto_reply: true
