# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.next/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        로그아웃·기관 전환·세션 만료 후 이전 QR이나 예약 정보가 표시되는지 확인하세요.
        앱을 백그라운드에서 다시 열거나 네트워크가 끊겼을 때 만료된 QR을 유효한 출입증처럼 보여주는 변경을 지적하세요.
        인증 토큰과 QR 원문이 로그·분석 이벤트·일반 저장소에 남는지, 알림이나 딥링크로 진입할 때 현재 계정과 기관의 접근 권한을 확인하는지 검토하세요.
        게이트 시뮬레이터는 서버가 명시적으로 허용한 경우에만 출입 성공을 표시하고, 검증 거부·응답 지연·통신 실패를 구분하는지 확인하세요.
chat:
  auto_reply: true
