# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^develop$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.next/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        기관 전환과 로그아웃 시 출입증과 세션이 정리되는지 확인합니다. QR 만료·갱신, 카메라 권한, 네트워크 오류, 게이트 시뮬레이터의 허용·거부 표시를 검토합니다.
chat:
  auto_reply: true
